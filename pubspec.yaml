name: lab02_login
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.3

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # lab 4 et 5 : sauvegarde cryptée
  encrypted_shared_preferences: 3.0.1
  # lab 5 : ouvrir tel:, sms: et mailto:
  url_launcher: ^6.3.3

  # lab 7 : base de données Drift
  drift: ^2.28.2
  drift_flutter: ^0.2.5
  path_provider: ^2.1.5
  path: ^1.9.1
  sqlite3_flutter_libs: ^0.5.39

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

  # lab 7 : génère le code Dart à partir du fichier .drift
  build_runner: ^2.6.0
  drift_dev: ^2.28.1

flutter:
  uses-material-design: true
  assets:
    - assets/lang/en.json
    - assets/lang/fr.json
    - assets/question-mark.webp
    - assets/light-bulb.webp
    - assets/stop-sign.png